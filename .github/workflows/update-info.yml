name: update-info

on:
  schedule:
    # 每 15 分钟（行情盘中变化快，比运动板块加密一档；UTC）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 与 update-sports 共用串行组，避免两个任务同时提交互相冲突
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch tech & finance data
        run: node scripts/fetch-info.mjs

      - name: Commit if changed
        run: |
          git config user.name "info-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tech.json data/finance.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash
            git commit -m "chore: update tech/finance data"
            git push
          fi
